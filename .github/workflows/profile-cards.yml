name: 魔力观测 · 生成统计卡片

on:
  schedule:
    - cron: '17 */12 * * *'   # 每 12 小时刷新一次
  workflow_dispatch:           # 也可以在 Actions 页面手动运行
  push:
    branches: [main]
    paths: ['.github/workflows/profile-cards.yml']

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: main
          UTC_OFFSET: 8
